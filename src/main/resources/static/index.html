<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Completa Álbum</title>

    <meta name="theme-color" content="#17212b">
    <meta name="description" content="Acompanhe sua coleção de figurinhas da Copa do Mundo 2026.">

    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <header class="header">

        <div class="header-topline">
            <span class="header-kicker">Coleção oficial</span>
            <span class="header-year">2026</span>
        </div>

        <div class="brand-lockup">
            <div class="brand-mark" aria-hidden="true">⚽</div>
            <div>
                <h1>Completa Álbum</h1>
                <p>Copa do Mundo</p>
            </div>
        </div>

    </header>

    <div class="card-progresso">

        <div class="progresso-cabecalho">
            <span class="progresso-label">Progresso da coleção</span>
        </div>

        <div class="barra-container">
            <div id="barra-progresso"></div>
        </div>

    </div>

    <div class="resumo-album">
        <div class="chip">
            <span>Total</span>
            <strong id="total-figurinhas">0</strong>
        </div>
        <div class="chip sucesso">
            <span>Obtidas</span>
            <strong id="obtidas-figurinhas">0</strong>
        </div>
        <div class="chip alerta">
            <span>Faltantes</span>
            <strong id="faltantes-figurinhas">0</strong>
        </div>
        <div class="chip info">
            <span>%</span>
            <strong id="percentual-figurinhas">0%</strong>
        </div>
    </div>

    <div class="search-box">
        <input
                type="text"
                id="busca"
                placeholder="Buscar país ou figurinha..."
        >
        <button id="limpar-busca" class="clear-search" type="button" aria-label="Limpar busca">×</button>
    </div>

    <label class="filtro-faltantes">
        <input type="checkbox" id="somente-faltantes">
        <span>Mostrar somente faltantes</span>
    </label>

    <nav id="navegacao-grupos" class="navegacao-grupos" aria-label="Navegação rápida por grupos"></nav>

    <div id="figurinhas"></div>

</div>

<script src="script.js"></script>
<script>
    if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
            navigator.serviceWorker.register("service-worker.js");
        });
    }
</script>

</body>
</html>
